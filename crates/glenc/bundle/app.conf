# GlEnc's slots for the packaging kit (tools/package, copied from glance-core v0.4.0). Sourced by bash.
# Since the swap (E6, 2026-11-17) the released GlEnc: Swift GlEnc's name and bundle id, so it replaces
# /Applications/GlEnc.app and keeps its settings (com.amritus.glenc). Test builds set "GlEnc RS" /
# com.amritus.glenc.rs here and in src/app/mod.rs (E1–E5 used them).
APP_NAME="GlEnc"
BUNDLE_ID="com.amritus.glenc"
EXECUTABLE="GlEnc"
CARGO_PACKAGE="glenc"
REPO="$(cd "$(dirname "${BASH_SOURCE[0]}")/../../.." && pwd)"
INFO_PLIST="Info.plist"
# The workspace version (Cargo.toml [workspace.package]).
VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' "$REPO/Cargo.toml" | head -1)"
MIN_MACOS="14.0"
# The notarytool keychain profile on the build machine (a name, not a secret).
NOTARY_PROFILE="amritus-notary"
# "auto": the first Developer ID Application identity in the keychain.
SIGN_IDENTITY="auto"
INSTALL_DIR="/Applications"
# Swift GlEnc's icon (glenc/assets/GlEnc.icns @ ed63fd6, built by its scripts/build-icon.sh).
ICON="GlEnc.icns"
# Swift GlEnc's entitlements (glenc/scripts/entitlements.plist @ ed63fd6): no sandbox, user-selected read-only.
ENTITLEMENTS="$REPO/crates/glenc/bundle/entitlements.plist"
# Outside the project tree (working rule 8).
STAGE_DIR="${KIT_STAGE_DIR:-${TMPDIR:-/tmp}/glance-kit/$BUNDLE_ID}"
